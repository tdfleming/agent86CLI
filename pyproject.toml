[project]
name = "agent86"
version = "1.0.0"
description = "An agentic harness on the command line — connects to remote or local models and lets them use tools and skills."
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Tony Fleming" }]
keywords = ["agent", "agentic", "harness", "llm", "cli", "mcp", "tools"]
classifiers = [
    "Development Status :: 5 - Production/Stable",  # 1.0.0 is live on PyPI (2026-09-21)
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development",
    "Topic :: Software Development :: Code Generators",
    "Topic :: Utilities",
    "Typing :: Typed",
]

# Core dependencies — kept light so `agent86` starts fast.
# Provider SDKs, embeddings, MCP, tracing, and Docker live behind extras.
dependencies = [
    "typer>=0.12",
    "rich>=13.7",
    "textual>=1.0",  # core-but-lazy: imported only inside the TUI entry path (see agent86/tui)
    "keyring>=25.0",  # core-but-lazy: imported only inside agent86/secrets.py function bodies
    "tomlkit>=0.13",  # core-but-lazy: imported only inside agent86/config_writer.py function bodies
    "pydantic>=2.7",
    "httpx>=0.27",
    "platformdirs>=4.2",
]

[project.optional-dependencies]
anthropic = ["anthropic>=0.40"]
openai = ["openai>=1.40"]
local = ["sentence-transformers>=3.0", "sqlite-vec>=0.1.1"]
mcp = ["mcp>=1.0"]
otel = ["opentelemetry-sdk>=1.27", "opentelemetry-exporter-otlp>=1.27"]
docker = ["docker>=7.1"]
web = ["beautifulsoup4>=4.12"]  # clean article extraction for web_fetch (falls back to regex)
all = [
    "anthropic>=0.40",
    "openai>=1.40",
    "sentence-transformers>=3.0",
    "sqlite-vec>=0.1.1",
    "mcp>=1.0",
    "opentelemetry-sdk>=1.27",
    "opentelemetry-exporter-otlp>=1.27",
    "docker>=7.1",
    "beautifulsoup4>=4.12",
]
dev = [
    "pytest>=8.2", "pytest-asyncio>=0.23", "pytest-cov>=5.0", "ruff>=0.6", "mypy>=1.11",
    "sqlite-vec>=0.1.1",  # exercise the native vec_distance_cosine search path in CI
    "beautifulsoup4>=4.12",  # exercise the readability extraction path in CI
    "mcp>=1.0",  # exercise the live MCP transport test (stdio/SSE/HTTP) in CI
    "anthropic>=0.40",  # test_anthropic_sdk_guard / test_sampling_params import the real SDK
    "build>=1.2",  # `python -m build` for the packaging tests and the release workflow
    "twine>=5.1",  # `twine check dist/*` — metadata/README render gate before publish
]

[project.scripts]
agent86 = "agent86.cli:app"

[project.urls]
Homepage = "https://github.com/tdfleming/agent86CLI"
Repository = "https://github.com/tdfleming/agent86CLI"
Documentation = "https://github.com/tdfleming/agent86CLI/blob/master/docs/ARCHITECTURE.md"
Changelog = "https://github.com/tdfleming/agent86CLI/blob/master/CHANGELOG.md"
Issues = "https://github.com/tdfleming/agent86CLI/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Shared exclusions — development scaffolding never belongs in a published artifact.
[tool.hatch.build]
exclude = [
    "/.github",
    "/.planning",
    "/.claude",
    "/.vscode",
    "/tests",
    "/docs/*.pdf",
    "**/__pycache__",
    "**/*.py[cod]",
]

# The sdist is an allowlist: source, the docs a packager needs, and nothing else.
[tool.hatch.build.targets.sdist]
include = [
    "/src/agent86",
    "/pyproject.toml",
    "/README.md",
    "/CHANGELOG.md",
    "/LICENSE",
    "/docs/ARCHITECTURE.md",
]

[tool.hatch.build.targets.wheel]
packages = ["src/agent86"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# The packaging tests build real artifacts and install them into a throwaway venv — far too slow
# for the default run, so they are opt-in. A command-line `-m` is appended after addopts and
# therefore wins, which is how CI's `package` job selects them: `pytest -m packaging`.
addopts = "-m 'not packaging'"
markers = [
    "packaging: builds and installs a distribution artifact (slow; excluded from the default run)",
]

[tool.coverage.run]
source = ["agent86"]
branch = true

[tool.coverage.report]
# Coverage is observable, not yet gated — no fail_under until the suite catches up. Skip
# lines that are defensive/unreachable or platform-specific.
show_missing = true
skip_covered = false
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "pragma: no cover",
]

[tool.mypy]
# CI runs mypy on 3.12; the local numpy stubs also require it.
python_version = "3.12"
packages = ["agent86"]
strict = false
warn_unused_ignores = true

# Optional backends imported lazily behind extras; CI's [dev] install omits them, so mypy
# can't resolve them there. (openai ships py.typed and resolves when installed; the rest don't.)
[[tool.mypy.overrides]]
module = [
    "anthropic.*",
    "openai.*",
    "sentence_transformers.*",
    "sqlite_vec.*",
    "docker.*",
    "mcp.*",
    "opentelemetry.*",
]
ignore_missing_imports = true
