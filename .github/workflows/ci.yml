name: CI

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (ruff + mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Install project (dev extras)
        run: |
          uv venv
          uv pip install -e ".[dev]"
      - name: ruff check
        run: uv run ruff check .
      - name: mypy
        run: uv run mypy src/agent86

  test:
    name: Test (py${{ matrix.python }} on ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.11", "3.12", "3.13"]
        include:
          # Windows is the primary target — cover it on one interpreter.
          - os: windows-latest
            python: "3.12"
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true
      - name: Install project (dev extras)
        run: |
          uv venv
          uv pip install -e ".[dev]"
      - name: pytest (with coverage)
        run: uv run pytest -q --cov --cov-report=term-missing --cov-report=xml

  package:
    name: Package (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Install project (dev extras)
        run: |
          uv venv
          uv pip install -e ".[dev]"
      # Cheap and always-on: catches a version/CHANGELOG drift long before anyone tags.
      # The tag comparison is skipped automatically on a branch build.
      - name: Release pre-flight
        run: uv run python scripts/check_release.py
      - name: Build sdist and wheel
        run: uv build
      - name: twine check
        run: uv run twine check dist/*
      # Opt in explicitly — the default run carries `-m 'not packaging'` from pyproject.
      - name: Packaging tests
        run: uv run pytest -m packaging tests/packaging -q
