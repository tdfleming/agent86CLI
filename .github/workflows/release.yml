name: Release

# Tagging `vX.Y.Z` is the whole release ritual: pre-flight, build, verify, publish to PyPI via
# trusted publishing (no API token lives in this repo), then cut the GitHub Release with that
# version's CHANGELOG section as the body.
#
# `workflow_dispatch` runs the same pipeline against TestPyPI so the publish path can be
# rehearsed without burning a version number on PyPI (a filename can never be reused there).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      target:
        description: "Index to publish to"
        type: choice
        options: [testpypi, pypi]
        default: testpypi
        required: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  FORCE_COLOR: "1"

jobs:
  build:
    name: Pre-flight, build and verify
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install project (dev extras)
        run: |
          uv venv
          uv pip install -e ".[dev]"

      # First, and fail fast: the tag, pyproject and agent86.__version__ must agree, the
      # CHANGELOG must have a section for this version, and [Unreleased] must be empty.
      # The tag is picked up from GITHUB_REF_NAME on a tag build and skipped otherwise.
      - name: Release pre-flight
        run: uv run python scripts/check_release.py

      - name: Read the version
        id: version
        run: |
          version="$(uv run python -c "import tomllib,pathlib;print(tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version'])")"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Releasing agent86 $version"

      - name: Build sdist and wheel
        run: uv build

      - name: twine check
        run: uv run twine check dist/*

      # The packaging tests build their own artifacts into a temp dir and install the wheel
      # into a throwaway venv — they verify the thing we are about to publish, not the repo.
      - name: Packaging tests
        run: uv run pytest -m packaging tests/packaging -q

      - name: Extract the release notes
        run: uv run python scripts/changelog_section.py "${{ steps.version.outputs.version }}" --output release-notes.md

      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error

      - name: Upload release notes
        uses: actions/upload-artifact@v4
        with:
          name: release-notes
          path: release-notes.md
          if-no-files-found: error

  publish-testpypi:
    name: Publish to TestPyPI
    needs: build
    if: github.event_name == 'workflow_dispatch' && inputs.target == 'testpypi'
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/agent86
    permissions:
      # Trusted publishing (OIDC) — no PyPI token is stored in this repository.
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true

  publish-pypi:
    name: Publish to PyPI
    needs: build
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.target == 'pypi')
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/agent86
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    name: GitHub Release
    needs: [build, publish-pypi]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - uses: actions/download-artifact@v4
        with:
          name: release-notes

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --title "agent86 ${{ needs.build.outputs.version }}" \
            --notes-file release-notes.md \
            dist/*
